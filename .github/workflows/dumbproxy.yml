name: dumbproxy

on:
  workflow_dispatch:
  schedule:
    - cron: '0 19 * * 5'  # 周六 03:00 北京时间 (周五 19:00 UTC)

env:
  HUAWEICLOUD_IAM_AK: "${{ secrets.HUAWEICLOUD_IAM_AK }}"
  HUAWEICLOUD_IAM_SK: "${{ secrets.HUAWEICLOUD_IAM_SK }}"

jobs:
  main_job:
    runs-on: ubuntu-26.04
    env:
      TZ: Asia/Shanghai
    outputs:
      current_datetime: ${{ steps.global_env.outputs.current_datetime }}
      current_user: ${{ github.actor }}
    steps:
      - name: 生成全局环境变量
        id: global_env
        run: |
          set -exuo pipefail
          echo "current_datetime=$(date +'%Y%m%d_%H%M%S')" >> $GITHUB_OUTPUT

  ubuntu_container_image_build:
    runs-on: ubuntu-26.04
    needs: main_job
    timeout-minutes: 60
    env:
      TZ: Asia/Shanghai
      current_datetime: ${{ needs.main_job.outputs.current_datetime }}
      current_user: ${{ needs.main_job.outputs.current_user }}
    steps:
      - name: 安装配置 Docker
        uses: docker/setup-docker-action@v5
        with:
          version: 'v28.5.2'

      - name: 查看系统信息
        run: |
          set -exuo pipefail
          pwd; id; uname -a; docker info; docker images; df -h

      - name: 检出代码
        uses: actions/checkout@v7

      - name: 登录 GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 登录 SWR
        run: docker login -u ap-southeast-1@$HUAWEICLOUD_IAM_AK -p $HUAWEICLOUD_IAM_SK swr.ap-southeast-1.myhuaweicloud.com

      - name: 构建容器镜像
        run: |
          set -exuo pipefail

          swr_image_url=swr.ap-southeast-1.myhuaweicloud.com/gsc-hub/dumbproxy:${current_datetime}-x86_64
          ghcr_image_url=ghcr.io/${current_user}/dumbproxy:${current_datetime}-x86_64

          docker build -f dumbproxy/Dockerfile --no-cache --output type=docker -t ${swr_image_url} .
          docker tag ${swr_image_url} ${ghcr_image_url}

          docker images
          docker history ${swr_image_url}
          pwd
          df -h

          docker push ${swr_image_url}
          docker push ${ghcr_image_url}
