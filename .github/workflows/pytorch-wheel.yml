name: pytorch-wheel

on:
  workflow_dispatch:
    inputs:
      torch_version:
        description: 'PyTorch 版本号 (对应 pytorch/pytorch 的 vX.Y.Z tag)'
        required: true
        default: '2.12.1'
      cuda_arch:
        description: '目标 GPU 计算能力 (12.0 = RTX 50 系 Blackwell)'
        required: true
        default: '12.0'
      max_jobs:
        description: '并行编译任务数 (构建机内存不足时调低)'
        required: true
        default: '4'

permissions:
  contents: write

jobs:
  build_and_release:
    runs-on: ubuntu-26.04
    timeout-minutes: 350
    env:
      TZ: Asia/Shanghai
    steps:
      - name: Set up Docker
        uses: docker/setup-docker-action@v5
        with:
          version: 'v28.5.2'

      - name: clean disk
        run: |
          set -exuo pipefail
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache || true
          pwd; docker info; df -h

      - name: git checkout
        uses: actions/checkout@v7

      - name: verify pytorch tag exists
        env:
          TORCH_VERSION: ${{ inputs.torch_version }}
        run: |
          set -exuo pipefail
          git ls-remote --tags https://github.com/pytorch/pytorch.git | grep -q "refs/tags/v${TORCH_VERSION}$" \
            || { echo "::error::pytorch/pytorch 不存在 tag v${TORCH_VERSION}"; exit 1; }

      - name: build torch wheel
        run: |
          set -exuo pipefail

          docker build \
            --build-arg TORCH_VERSION=${{ inputs.torch_version }} \
            --build-arg CUDA_ARCH=${{ inputs.cuda_arch }} \
            --build-arg MAX_JOBS=${{ inputs.max_jobs }} \
            -f pytorch/Dockerfile.wheel \
            -t torch-wheel-builder:tmp \
            .

          # 从镜像中提取 wheel（dist/ 目录内容拷贝到宿主机）
          docker create --name torch-wheel-export torch-wheel-builder:tmp
          mkdir -p dist
          docker cp torch-wheel-export:/tmp/pytorch/dist/. dist/
          docker rm -f torch-wheel-export

          ls -alh dist/
          (cd dist && sha256sum *.whl)
          df -h

      - name: create release and upload wheel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TORCH_VERSION: ${{ inputs.torch_version }}
          CUDA_ARCH: ${{ inputs.cuda_arch }}
        run: |
          set -exuo pipefail

          ARCH_SUFFIX=$(printf '%s' "${CUDA_ARCH}" | tr -d '.')
          TAG="torch-v${TORCH_VERSION}-sm${ARCH_SUFFIX}"
          SHA256=$(cd dist && sha256sum *.whl | awk '{print $1}')

          cat > /tmp/release_notes.md <<EOF
          PyTorch v${TORCH_VERSION} 源码编译 wheel（仅 CUDA sm_${ARCH_SUFFIX}）

          - 目标架构: TORCH_CUDA_ARCH_LIST=${CUDA_ARCH} (sm_${ARCH_SUFFIX})
          - 编译环境: nvidia/cuda:13.3.1-cudnn-devel-ubuntu26.04
          - 构建定义: pytorch/Dockerfile.wheel
          - 动态链接 CUDA 库，需配合 runtime 系 CUDA 镜像使用
          - sha256: ${SHA256}

          由 pytorch-wheel 工作流自动发布，供 pytorch.yml 镜像构建复用。
          EOF

          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" dist/*.whl --clobber
          else
            gh release create "${TAG}" dist/*.whl \
              --title "PyTorch v${TORCH_VERSION} sm${ARCH_SUFFIX}" \
              --notes-file /tmp/release_notes.md
          fi

          gh release view "${TAG}" --json assets --jq '.assets[] | {name, size}'
